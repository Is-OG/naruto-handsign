<!DOCTYPE html>
<html>
<head>
  <title>Naruto Hand Sign Detector</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#050505;
      display:flex;
      flex-direction:column;
      align-items:center;
      font-family:Arial,sans-serif;
      color:white;
      min-height:100vh;
      overflow:hidden;
    }

    h1{
      margin:18px 0 10px;
      color:#ff6b00;
      font-size:26px;
      text-shadow:0 0 12px #ff6b00aa;
      letter-spacing:1px;
    }

    #container{
      position:relative;
      width:640px;
      height:480px;
    }

    video{
      width:640px;
      height:480px;
      border:3px solid #ff6b00;
      border-radius:12px;
      transform:scaleX(-1);
      display:block;
    }

    canvas{
      position:absolute;
      top:0;
      left:0;
      width:640px;
      height:480px;
      transform:scaleX(-1);
      border-radius:12px;
    }

    #flash{
      position:absolute;
      top:0;
      left:0;
      width:640px;
      height:480px;
      border-radius:12px;
      background:radial-gradient(circle,#ffffff,#88eeff,transparent);
      opacity:0;
      pointer-events:none;
      transition:opacity 0.05s;
      z-index:10;
    }

    #sign-display{
      margin-top:14px;
      font-size:30px;
      font-weight:bold;
      color:#ff6b00;
      text-shadow:0 0 16px #ff6b00aa;
      min-height:40px;
    }

    #combo-display{
      margin-top:10px;
      font-size:20px;
      min-height:32px;
      display:flex;
      gap:6px;
      align-items:center;
    }

    .csign{
      transition:all 0.3s;
      font-size:22px;
    }

    .csign.done{
      filter:drop-shadow(0 0 6px #00ff88);
      transform:scale(1.2);
    }

    .csign.next{
      animation:blink 0.5s infinite alternate;
    }

    .csign.todo{
      opacity:0.25;
    }

    .arrow{
      color:#444;
      font-size:14px;
    }

    @keyframes blink{
      from{opacity:0.4}
      to{opacity:1}
    }

    #jutsu-name{
      margin-top:10px;
      font-size:0px;
      color:#00cfff;
      text-shadow:0 0 20px #00cfff,0 0 40px #00cfff;
      font-style:italic;
      font-weight:bold;
      letter-spacing:3px;
      transition:font-size 0.4s ease,opacity 0.4s;
      opacity:0;
      min-height:36px;
    }

    #jutsu-name.show{
      font-size:26px;
      opacity:1;
    }

    #status{
      margin-top:6px;
      font-size:13px;
      color:#666;
      min-height:20px;
    }

    #hold-bar-wrap{
      margin-top:10px;
      width:200px;
      height:6px;
      background:#222;
      border-radius:3px;
      overflow:hidden;
      opacity:0;
      transition:opacity 0.2s;
    }

    #hold-bar{
      height:100%;
      width:0%;
      background:linear-gradient(90deg,#ff6b00,#ffcc00);
      border-radius:3px;
      transition:width 0.05s linear;
    }
  </style>
</head>

<body>

<h1>🥷 Naruto Hand Sign Detector</h1>

<div id="container">
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="flash"></div>
</div>

<div id="sign-display">Waiting for hand...</div>

<div id="combo-display"></div>

<div id="hold-bar-wrap">
  <div id="hold-bar"></div>
</div>

<div id="jutsu-name">⚡ Rasengan!</div>

<div id="status">Loading...</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

const signDisplay=document.getElementById('sign-display');
const comboDisplay=document.getElementById('combo-display');
const jutsuNameEl=document.getElementById('jutsu-name');
const statusEl=document.getElementById('status');

const holdBarWrap=document.getElementById('hold-bar-wrap');
const holdBar=document.getElementById('hold-bar');

const flashEl=document.getElementById('flash');

canvas.width=640;
canvas.height=480;

const COMBO=['🐍 Snake','🐦 Bird','🖐️ Tiger'];

let comboIndex=0;
let lastSign='';
let holdStart=null;

const HOLD_MS=150;

let jutsuActive=false;

let rasenX=320;
let rasenY=240;

let rasenTargetX=320;
let rasenTargetY=240;

let rasenAngle=0;
let rasenScale=0;

let shakeFrames=0;

let time=0;

function triggerFlash(){

  flashEl.style.opacity='1';

  setTimeout(()=>flashEl.style.opacity='0.5',60);
  setTimeout(()=>flashEl.style.opacity='0',400);
}

function triggerShake(){
  shakeFrames=20;
}

function updateComboUI(){

  comboDisplay.innerHTML=COMBO.map((sign,i)=>{

    const em=sign.split(' ')[0];

    let cls=
      i<comboIndex ? 'done' :
      i===comboIndex ? 'next' :
      'todo';

    let html=`<span class="csign ${cls}">${em}</span>`;

    if(i<COMBO.length-1){
      html+=`<span class="arrow">›</span>`;
    }

    return html;

  }).join('');
}

function activateJutsu(x,y){

  jutsuActive=true;

  jutsuNameEl.classList.add('show');

  rasenScale=0;

  triggerFlash();
  triggerShake();

  statusEl.textContent='JUTSU ACTIVE — remove hand to cancel';
}

function deactivateJutsu(){

  jutsuActive=false;

  jutsuNameEl.classList.remove('show');

  rasenScale=0;

  comboIndex=0;

  updateComboUI();

  statusEl.textContent='Jutsu cancelled — show hand to restart';
}

function drawRasengan(x,y,angle,scale){

  if(scale<=0) return;

  time++;

  const r=58*Math.min(scale,1);

  const pulse=1+Math.sin(time*0.12)*0.025;

  ctx.save();

  ctx.translate(x,y);

  ctx.globalAlpha=Math.min(scale,1);

  // NATURAL OUTER AURA

  const outerAura=ctx.createRadialGradient(
    0,0,r*0.2,
    0,0,r*3.4
  );

  outerAura.addColorStop(0,'rgba(150,255,255,0.04)');
  outerAura.addColorStop(0.25,'rgba(0,210,255,0.08)');
  outerAura.addColorStop(0.55,'rgba(0,110,255,0.05)');
  outerAura.addColorStop(1,'rgba(0,0,255,0)');

  ctx.beginPath();

  ctx.arc(0,0,r*3.4*pulse,0,Math.PI*2);

  ctx.fillStyle=outerAura;

  ctx.fill();

  // SOFT RANDOM ENERGY FOG

  for(let i=0;i<28;i++){

    const a=Math.random()*Math.PI*2;

    const dist=Math.random()*r*1.5;

    const size=Math.random()*r*0.9;

    const px=Math.cos(a)*dist;
    const py=Math.sin(a)*dist;

    const fog=ctx.createRadialGradient(
      px,py,0,
      px,py,size
    );

    fog.addColorStop(0,'rgba(120,220,255,0.04)');
    fog.addColorStop(1,'rgba(0,0,255,0)');

    ctx.beginPath();

    ctx.arc(px,py,size,0,Math.PI*2);

    ctx.fillStyle=fog;

    ctx.fill();
  }

  // MAIN BALL

  const sphere=ctx.createRadialGradient(
    -r*0.2,
    -r*0.2,
    r*0.03,
    0,
    0,
    r
  );

  sphere.addColorStop(0,'rgba(255,255,255,1)');
  sphere.addColorStop(0.10,'rgba(210,250,255,1)');
  sphere.addColorStop(0.30,'rgba(90,235,255,0.92)');
  sphere.addColorStop(0.58,'rgba(0,155,255,0.72)');
  sphere.addColorStop(0.85,'rgba(0,70,220,0.34)');
  sphere.addColorStop(1,'rgba(0,40,180,0)');

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    r*pulse,
    0,
    Math.PI*2
  );

  ctx.fillStyle=sphere;

  ctx.shadowColor='#00cfff';
  ctx.shadowBlur=45;

  ctx.fill();

  // RANDOM WHITE SCRIBBLE LINES

  ctx.save();

  ctx.rotate(angle*0.8);

  for(let i=0;i<170;i++){

    const startA=Math.random()*Math.PI*2;
    const endA=startA+(Math.random()-0.5)*2;

    const startR=Math.random()*r*0.92;
    const endR=Math.random()*r*0.92;

    const sx=Math.cos(startA)*startR;
    const sy=Math.sin(startA)*startR;

    const ex=Math.cos(endA)*endR;
    const ey=Math.sin(endA)*endR;

    const c1x=(sx+ex)/2+(Math.random()-0.5)*25;
    const c1y=(sy+ey)/2+(Math.random()-0.5)*25;

    ctx.beginPath();

    ctx.moveTo(sx,sy);

    ctx.quadraticCurveTo(
      c1x,
      c1y,
      ex,
      ey
    );

    ctx.strokeStyle=`rgba(255,255,255,${
      0.18+Math.random()*0.25
    })`;

    ctx.lineWidth=0.7+Math.random()*1.1;

    ctx.shadowColor='rgba(255,255,255,0.7)';
    ctx.shadowBlur=5;

    ctx.stroke();
  }

  ctx.restore();

  // INNER ENERGY SWIRL

  ctx.save();

  ctx.rotate(-angle*1.5);

  for(let i=0;i<12;i++){

    ctx.rotate(Math.PI*2/12);

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      r*0.46,
      -0.7,
      0.7
    );

    ctx.strokeStyle='rgba(150,255,255,0.12)';

    ctx.lineWidth=1.3;

    ctx.shadowColor='#88ffff';
    ctx.shadowBlur=8;

    ctx.stroke();
  }

  ctx.restore();

  // BRIGHT CORE

  const core=ctx.createRadialGradient(
    0,
    0,
    0,
    0,
    0,
    r*0.30
  );

  core.addColorStop(0,'rgba(255,255,255,1)');
  core.addColorStop(0.4,'rgba(220,255,255,0.95)');
  core.addColorStop(0.8,'rgba(120,255,255,0.35)');
  core.addColorStop(1,'rgba(0,255,255,0)');

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    r*0.30,
    0,
    Math.PI*2
  );

  ctx.fillStyle=core;

  ctx.shadowColor='white';
  ctx.shadowBlur=30;

  ctx.fill();

  ctx.restore();
}

function drawSkeleton(lm,alpha){

  ctx.globalAlpha=alpha;

  for(const conn of HAND_CONNECTIONS){

    const s=lm[conn[0]];
    const e=lm[conn[1]];

    ctx.beginPath();

    ctx.moveTo(s.x*640,s.y*480);
    ctx.lineTo(e.x*640,e.y*480);

    ctx.strokeStyle='#00ff88';

    ctx.lineWidth=2;

    ctx.shadowColor='#00ff88';
    ctx.shadowBlur=4;

    ctx.stroke();
  }

  ctx.shadowBlur=0;

  for(const l of lm){

    ctx.beginPath();

    ctx.arc(l.x*640,l.y*480,5,0,Math.PI*2);

    ctx.fillStyle='#ff3333';

    ctx.shadowColor='#ff0000';
    ctx.shadowBlur=6;

    ctx.fill();
  }

  ctx.shadowBlur=0;
  ctx.globalAlpha=1;
}

function isFingerUp(lm,tip,pip){
  return lm[tip].y<lm[pip].y-0.03;
}

function isThumbUp(lm,handedness){

  return handedness==='Right'
    ? lm[4].x<lm[3].x-0.02
    : lm[4].x>lm[3].x+0.02;
}

function detectSign(lm,handedness){

  const thumb=isThumbUp(lm,handedness),
        index=isFingerUp(lm,8,6),
        middle=isFingerUp(lm,12,10),
        ring=isFingerUp(lm,16,14),
        pinky=isFingerUp(lm,20,18);

  if(!thumb&&!index&&!middle&&!ring&&!pinky) return '🐍 Snake';
  if(thumb&&index&&middle&&ring&&pinky) return '🖐️ Tiger';
  if(!thumb&&!index&&!middle&&!ring&&pinky) return '🐦 Bird';

  return '🤔 Keep trying...';
}

const hands=new Hands({
  locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});

hands.setOptions({
  maxNumHands:1,
  modelComplexity:1,
  minDetectionConfidence:0.7,
  minTrackingConfidence:0.7
});

hands.onResults((results)=>{

  if(shakeFrames>0){

    shakeFrames--;

    const s=(shakeFrames/20)*6;

    canvas.style.transform=
      `scaleX(-1) translate(${(Math.random()-.5)*s}px,${(Math.random()-.5)*s}px)`;

  }else{
    canvas.style.transform='scaleX(-1)';
  }

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const handFound=
    results.multiHandLandmarks &&
    results.multiHandLandmarks.length>0;

  if(jutsuActive){

    if(!handFound){
      deactivateJutsu();
      return;
    }

    const lm=results.multiHandLandmarks[0];

    const palmX=
      (lm[0].x+lm[5].x+lm[9].x+lm[13].x)/4;

    const palmY=
      (lm[0].y+lm[5].y+lm[9].y+lm[13].y)/4;

    const dx=lm[9].x-lm[0].x;
    const dy=lm[9].y-lm[0].y;

    rasenTargetX=(palmX+dx*0.35)*640;
    rasenTargetY=(palmY+dy*0.35)*480;

    rasenX+=(rasenTargetX-rasenX)*0.20;
    rasenY+=(rasenTargetY-rasenY)*0.20;

    rasenScale=Math.min(rasenScale+0.03,1.3);

    rasenAngle+=0.09;

    drawSkeleton(lm,0.15);

    drawRasengan(rasenX,rasenY,rasenAngle,rasenScale);

    signDisplay.textContent='';

    statusEl.textContent='JUTSU ACTIVE — remove hand to cancel';

    return;
  }

  if(!handFound){

    signDisplay.textContent='Waiting for hand...';

    statusEl.textContent='Show your hand to the camera';

    holdBarWrap.style.opacity='0';

    holdStart=null;
    lastSign='';

    return;
  }

  const lm=results.multiHandLandmarks[0];

  const handedness=results.multiHandedness[0].label;

  drawSkeleton(lm,1);

  const sign=detectSign(lm,handedness);

  signDisplay.textContent=sign;

  statusEl.textContent=`Hand: ${handedness}`;

  if(!sign.includes('Keep trying') && sign===COMBO[comboIndex]){

    if(sign!==lastSign){

      holdStart=Date.now();

      lastSign=sign;

      holdBarWrap.style.opacity='1';
    }

    const elapsed=Date.now()-holdStart;

    holdBar.style.width=
      Math.min((elapsed/HOLD_MS)*100,100)+'%';

    if(elapsed>=HOLD_MS){

      holdStart=null;

      holdBar.style.width='0%';

      holdBarWrap.style.opacity='0';

      comboIndex++;

      updateComboUI();

      if(comboIndex>=COMBO.length){

        const palmX=
          (lm[0].x+lm[5].x+lm[9].x+lm[13].x)/4;

        const palmY=
          (lm[0].y+lm[5].y+lm[9].y+lm[13].y)/4;

        const dx=lm[9].x-lm[0].x;
        const dy=lm[9].y-lm[0].y;

        activateJutsu(
          (palmX+dx*0.35)*640,
          (palmY+dy*0.35)*480
        );
      }
    }

  }else{

    if(sign!==lastSign){

      lastSign=sign;

      holdStart=null;

      holdBar.style.width='0%';

      holdBarWrap.style.opacity='0';

      if(!sign.includes('Keep trying') &&
         sign!==COMBO[comboIndex]){

        comboIndex=sign===COMBO[0] ? 1 : 0;

        updateComboUI();
      }
    }
  }
});

updateComboUI();

const camera=new Camera(video,{

  onFrame:async()=>{
    await hands.send({image:video});
  },

  width:640,
  height:480
});

camera.start().then(()=>{
  statusEl.textContent='Camera ready! Show your hand!';
});

</script>

</body>
</html>
