<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Naruto Jutsu · Rasengan + Shadow Clone (Anime White Smoke)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🥷 NARUTO JUTSU LAB</h1>
<div class="subtitle">🐍🐦🖐️ Rasengan Combo  |  🐶 Dog Sign Hold 1.5s (Either Hand) → Shadow Clone + Anime White Smoke</div>

<div id="container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="flash"></div>
</div>

<div class="info-row">
  <div class="combo-panel">
    <div id="combo-display"></div>
  </div>
</div>

<div id="sign-display">🤚 Show either hand</div>
<div id="jutsu-name">🌀 RASENGAN!</div>
<button id="resetClonesBtn">✖ Reset Clones</button>
<div class="reset-tip">💡 Shadow Clone: hold 🐶 Dog sign (index+middle up, others down) 1.5s → white smoke burst + 4 clones (30s duration)</div>
<div class="status-text" id="statusMsg">Loading...</div>

<!-- MediaPipe Libraries -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>

<!-- Main Script -->
<script src="script.js"></script>
</body>
</html>
